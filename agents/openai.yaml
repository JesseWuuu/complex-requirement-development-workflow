interface:
  display_name: "复杂需求研发工作流"
  short_description: "规划复杂需求，先讲清并确认实现思路，再形成具体实施计划与分批交付"
  default_prompt: "使用 $complex-requirement-development-workflow 基于产品与仓库依据做只读实施演练，只将已批准契约写入 Spec 和测试，先讲清实现思路的整体路径与取舍，再以最小真实 Diff 生成具体实施计划；四份文档先保证读者理解，再删减冗余，不省略必要解释；按检查点确认，获准实施后逐批推进，非最后批停下供用户审阅，最后一批完成后自动结束，支持跨对话续接。"
