schema: requirement-spec/v2
feature_slug: "<feature-slug>"
repo_root: "<git-root>"
delivery_dir: "<spec-root>/<feature-slug>"
workflow_dir: "<spec-root>/.workflow/<feature-slug>"

workspace:
  workspace_path: null
  module_slug: null

inputs:
  prd:
    # 对话原文在交付目录落盘；本地文件填写原路径，无需先移动。
    path: "<canonical-prd-path>"
    sha256: null
  project_rules: []
  design_targets: []

current_phase: 1
status: in_progress
next_action: "界定问题与方案方向"
open_blockers: []

recovery:
  migrated_from_tasks: []

direction:
  # Spec 批准后改为 superseded；不创建单独的方向文件。
  status: not_started
  summary: null
  approved_at: null
  approval_note: null

artifacts:
  spec:
    status: not_started
    path: "<spec-root>/<feature-slug>/spec.md"
    sha256: null
    approved_at: null
    approval_note: null
  test:
    status: not_started
    path: "<spec-root>/<feature-slug>/test.md"
    sha256: null
    approved_at: null
    approval_note: null
  implementation:
    status: not_started
    path: "<spec-root>/<feature-slug>/implementation.md"
    sha256: null
    approved_at: null
    approval_note: null

repo_grounding:
  status: not_started
  checked_at: null
  fingerprint_sha256: null
  evidence_pack:
    path: null
    sha256: null
    input_fingerprint_sha256: null
  relevant_targets: []

# 三份已批准文档摘要与技术依据指纹的唯一聚合值。
plan_fingerprint_sha256: null

consistency_review:
  status: not_started
  plan_fingerprint_sha256: null
  reviewer_ref: null
  attempt: 0
  outcome: null
  conclusion: null
  conclusion_sha256: null
  completed_at: null
  revision_decision:
    # 明确编辑性修正不新增返修审批；awaiting_decision 默认不能与 passed/granted 共存。
    # 例外见跨对话续接：仅阶段 7、实施结果 in_progress、原审阅/授权/结果均绑定未变化规划且尚未开始终结审阅。
    # 只延续不受影响的有效原授权；待决范围与下一步记入 open_blockers/next_action，不借状态标记追认授权。
    status: not_required
    return_phase: null
    artifacts: []
    review_conclusion_sha256: null
    decided_at: null
    decision_note: null

implementation_authorization:
  status: not_granted
  plan_fingerprint_sha256: null
  granted_at: null
  approval_note: null

implementation_result:
  # not_started | in_progress | implemented | verified | invalidated
  # implemented：代码完成、全部验证项已记录，允许 failed/blocked；verified：所有验证项均 passed。
  # 两者均可进入终结代码审阅；均须有完整输出清单、输出指纹、验证记录和 completed_at。
  status: not_started
  plan_fingerprint_sha256: null
  output_manifest_complete: false
  output_fingerprint_sha256: null
  changes: []
  # changes item: {path, kind: present | removed, role, sha256}
  # 包含必要实现补充；role 关联 I-* 与职责，不因此改写原规划或批准指纹。
  verification: []
  # verification item: {check, result: passed | failed | blocked, evidence}
  # 必要补充的依据、影响与验证记入 check/evidence；失败记 failed，条件不足记 blocked，不阻止终结审阅。
  completed_at: null

post_implementation_review:
  status: not_started
  input_fingerprint_sha256: null
  reviewer_ref: null
  attempt: 0
  outcome: null
  conclusion: null
  conclusion_sha256: null
  completed_at: null
